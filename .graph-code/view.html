<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>graph-code - Ring</title>
  <script src="https://d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 50px;
      background: rgba(30,30,50,0.95); border-bottom: 1px solid #444;
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100;
    }
    .header h1 { font-size: 16px; color: #fff; }
    .tab { display: flex; gap: 4px; }
    .tab button {
      background: #2a2a4a; color: #888; border: none; padding: 6px 16px;
      border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .tab button:hover { background: #3a3a5a; }
    .tab button.active { background: #3498db; color: #fff; }
    
    #graph { position: fixed; top: 50px; left: 0; right: 0; bottom: 0; }
    
    .panel {
      position: fixed; top: 60px; right: 20px; width: 320px;
      background: rgba(30,30,50,0.98); border: 1px solid #444;
      border-radius: 12px; padding: 20px; max-height: 70vh; overflow-y: auto;
      z-index: 100; display: none;
    }
    .panel h2 { font-size: 15px; margin-bottom: 12px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .panel .close { float: right; cursor: pointer; color: #888; }
    
    .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #555; color: #ccc; }
    .status-dev { background: #3498db; color: #fff; }
    .status-done { background: #2ecc71; color: #fff; }
    .status-blocked { background: #e74c3c; color: #fff; }
    
    .node-type { font-size: 11px; color: #888; text-transform: uppercase; }
    
    .detail-section { margin-top: 12px; }
    .detail-label { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    .detail-value { font-size: 13px; color: #ccc; }
    
    .dep-list { list-style: none; padding: 0; }
    .dep-list li { padding: 4px 0; color: #aaa; font-size: 12px; }
    .dep-list li::before { content: "→ "; color: #e74c3c; }
    
    .file-list { list-style: none; padding: 0; }
    .file-list li { padding: 4px 0; color: #2ecc71; font-size: 12px; font-family: monospace; }
    
    .legend {
      position: fixed; bottom: 20px; left: 20px;
      background: rgba(30,30,50,0.95); border: 1px solid #444;
      border-radius: 8px; padding: 12px; font-size: 12px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .legend-circle { width: 12px; height: 12px; border-radius: 50%; }
    .legend-line { width: 24px; height: 2px; }
    
    .stats {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(30,30,50,0.95); border: 1px solid #444;
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
    }
    .stats span { color: #3498db; font-weight: bold; }
    
    .node circle { stroke: #fff; stroke-width: 2px; transition: all 0.2s; }
    .node:hover circle { stroke-width: 4px; cursor: pointer; }
    .node text { font-size: 11px; fill: #ccc; pointer-events: none; }
    .link { stroke: #555; stroke-opacity: 0.6; stroke-width: 1.5px; }
    .link.requires { stroke: #e74c3c; }
    .link.provides { stroke: #2ecc71; stroke-dasharray: 5,5; }
  </style>
</head>
<body>
  <div class="header">
    <h1>graph-code</h1>
    <div class="tab">
      <button class="active" onclick="showView('graph')">图谱</button>
      <button onclick="showView('kanban')">看板</button>
    </div>
  </div>
  
  <div id="graph"></div>
  
  <div class="panel" id="panel">
    <span class="close" onclick="closePanel()">✕</span>
    <h2 id="panel-title">详情</h2>
    <div id="panel-content"></div>
  </div>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-circle" style="fill:#9b59b6"></div><span>需求</span></div>
    <div class="legend-item"><div class="legend-circle" style="fill:#3498db"></div><span>功能</span></div>
    <div class="legend-item"><div class="legend-circle" style="fill:#1abc9c"></div><span>原子</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#e74c3c"></div><span>依赖</span></div>
  </div>
  
  <div class="stats" id="stats"></div>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight - 50;
    
    const statusLabels = { pending: '待开发', dev: '开发中', done: '已完成', blocked: '被阻塞' };
    const statusClass = { pending: 'status-pending', dev: 'status-dev', done: 'status-done', blocked: 'status-blocked' };
    const typeColors = { requirement: '#9b59b6', feature: '#3498db', atomic: '#1abc9c' };
    
    let nodes = [], links = [], currentView = 'graph';

    async function loadGraph() {
      const res = await fetch('graph.json');
      const data = await res.json();
      
      nodes = data.nodes.map(n => ({...n})));
      links = [];
      
      nodes.forEach(n => {
        if (n.deps) {
          n.deps.forEach(depId => {
            if (nodes.find(x => x.id === depId)) {
              links.push({ source: n.id, target: depId, type: 'requires' });
            }
          });
        }
      });
      
      updateStats();
      if (currentView === 'graph') renderGraph();
    }

    function updateStats() {
      const done = nodes.filter(n => n.status === 'done').length;
      const dev = nodes.filter(n => n.status === 'dev').length;
      document.getElementById('stats').innerHTML = 
        `共 <span>${nodes.length}</span> 节点 | 已完成 <span>${done}</span> | 开发中 <span>${dev}</span>`;
    }

    function renderGraph() {
      document.getElementById('graph').innerHTML = '';
      document.getElementById('panel').style.display = 'none';
      
      const svg = d3.select('#graph')
        .append('svg')
        .attr('width', width)
        .attr('height', height);
      
      const g = svg.append('g');
      
      svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform)));
      
      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(40));
      
      const link = g.selectAll('.link')
        .data(links)
        .enter()
        .append('line')
        .attr('class', d => 'link ' + d.type)
        .style('stroke', d => d.type === 'requires' ? '#e74c3c' : '#2ecc71');
      
      const node = g.selectAll('.node')
        .data(nodes)
        .enter()
        .append('g')
        .attr('class', 'node')
        .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
        .on('click', (e, d) => { e.stopPropagation(); showDetail(d); });
      
      node.append('circle')
        .attr('r', d => d.type === 'requirement' ? 24 : d.type === 'feature' ? 18 : 12)
        .attr('fill', d => typeColors[d.type])
        .style('opacity', d => d.status === 'blocked' ? 0.5 : 1);
      
      node.append('text')
        .attr('dx', d => d.type === 'requirement' ? 30 : d.type === 'feature' ? 24 : 20)
        .attr('dy', 4)
        .text(d => d.name);
      
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });
      
      function dragstarted(e, d) {
        if (!e.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
      function dragended(e, d) {
        if (!e.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }
    }

    function renderKanban() {
      document.getElementById('graph').innerHTML = '';
      document.getElementById('panel').style.display = 'none';
      
      const statuses = ['pending', 'dev', 'done', 'blocked'];
      const labels = ['待开发', '开发中', '已完成', '被阻塞'];
      
      let html = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px;height:' + height + 'px;overflow:auto;">';
      statuses.forEach((status, i) => {
        html += '<div style="background:#2a2a4a;border-radius:8px;padding:12px;">';
        html += '<h3 style="margin-bottom:12px;color:#fff;">' + labels[i] + ' (' + nodes.filter(n => n.status === status).length + ')</h3>';
        nodes.filter(n => n.status === status).forEach(n => {
          html += '<div onclick="showDetail(nodes.find(x=>x.id==\'' + n.id + '\'))" style="background:#1a1a2e;padding:10px;margin-bottom:8px;border-radius:4px;cursor:pointer;">';
          html += '<div style="font-size:13px;color:#fff;">' + n.name + '</div>';
          html += '<div style="font-size:11px;color:#888;margin-top:4px;">' + n.type + '</div>';
          html += '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
      document.getElementById('graph').innerHTML = html;
    }

    function showDetail(d) {
      const panel = document.getElementById('panel');
      const content = document.getElementById('panel-content');
      const title = document.getElementById('panel-title');
      
      title.textContent = d.name;
      let html = '<span class="node-type">' + d.type + '</span> <span class="status ' + statusClass[d.status] + '">' + statusLabels[d.status] + '</span>';
      html += '<p style="margin-top:12px;font-size:13px;color:#aaa;">' + (d.desc || '') + '</p>';
      
      if (d.deps && d.deps.length) {
        html += '<div class="detail-section"><div class="detail-label">依赖</div><ul class="dep-list">';
        d.deps.forEach(dep => {
          const depNode = nodes.find(n => n.id === dep);
          html += '<li>' + (depNode ? depNode.name : dep) + '</li>';
        });
        html += '</ul></div>';
      }
      
      if (d.provides && d.provides.length) {
        html += '<div class="detail-section"><div class="detail-label">提供</div><div class="detail-value">' + d.provides.join(', ') + '</div></div>';
      }
      
      if (d.files && d.files.length) {
        html += '<div class="detail-section"><div class="detail-label">文件</div><ul class="file-list">';
        d.files.forEach(f => html += '<li>' + f + '</li>');
        html += '</ul></div>';
      }
      
      content.innerHTML = html;
      panel.style.display = 'block';
    }

    function closePanel() {
      document.getElementById('panel').style.display = 'none';
    }

    function showView(view) {
      currentView = view;
      document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (view === 'graph') renderGraph();
      else renderKanban();
    }

    loadGraph();
  </script>
</body>
</html>
