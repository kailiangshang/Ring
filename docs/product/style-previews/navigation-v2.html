<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring · Navigation V2</title>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06080c; color: #bfc7d5; font-family: 'Cascadia Code', monospace; height: 100vh; overflow: hidden; display: flex; }

/* ========== Sidebar ========== */
.sidebar {
  width: 220px; min-width: 220px; background: #080c12;
  border-right: 1px solid #1a2030; display: flex; flex-direction: column;
  user-select: none;
}
.sidebar-header {
  padding: 12px 14px; border-bottom: 1px solid #1a2030;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-header svg { width: 20px; height: 20px; }
.sidebar-header .brand { color: #67E8F9; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
.sidebar-header .version { color: #3a4550; font-size: 9px; margin-left: auto; }
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 6px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 3px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }

.nav-super {
  padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid #1a2030; margin-bottom: 4px; transition: background 0.15s;
}
.nav-super:hover { background: #0d1420; }
.nav-super.active { background: #0d2a35; }
.nav-super .icon {
  width: 26px; height: 26px; border-radius: 4px;
  background: linear-gradient(135deg, #0891B2, #67E8F9);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #06080c; font-weight: 700;
}
.nav-super .label { color: #67E8F9; font-size: 12px; font-weight: 600; }
.nav-super .label-sub { color: #3a4550; font-size: 9px; margin-top: 1px; }

.ring-group { margin: 1px 0; }
.ring-header {
  padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.ring-header:hover { background: #0d1420; }
.ring-header .chevron { color: #3a4550; font-size: 9px; transition: transform 0.15s; width: 10px; }
.ring-header .chevron.open { transform: rotate(90deg); }
.ring-header .dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.ring-header .ring-name { font-size: 11px; color: #6b7d8e; flex: 1; }
.ring-header .ring-badge { font-size: 8px; color: #3a4550; background: #0d1117; padding: 1px 4px; border-radius: 2px; }
.ring-group.active > .ring-header .ring-name { color: #67E8F9; font-weight: 500; }
.ring-items { display: none; }
.ring-items.open { display: block; }
.ring-item {
  padding: 5px 14px 5px 42px; cursor: pointer; font-size: 10px;
  color: #4a5568; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.ring-item:hover { color: #8892a0; background: #0a0e14; }
.ring-item.active { color: #06B6D4; background: #0d1f28; }
.session-active {
  padding: 5px 14px 5px 42px; cursor: pointer; font-size: 10px;
  color: #22c55e; display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.session-active:hover { background: #0a1f0a; }
.session-active .pulse {
  width: 5px; height: 5px; border-radius: 50%; background: #22c55e;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.sidebar-footer {
  padding: 8px 14px; border-top: 1px solid #1a2030;
  display: flex; align-items: center; gap: 6px; font-size: 10px;
}
.sidebar-footer .avatar {
  width: 22px; height: 22px; border-radius: 3px;
  background: #0d2a35; color: #0891B2; display: flex;
  align-items: center; justify-content: center; font-size: 10px; font-weight: 600;
}
.sidebar-footer .user-name { color: #6b7d8e; flex: 1; }
.sidebar-footer .settings-btn { color: #3a4550; cursor: pointer; font-size: 12px; }
.sidebar-footer .settings-btn:hover { color: #0891B2; }

/* ========== Main ========== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* Horizontal tab bar */
.tab-bar {
  padding: 0 20px; border-bottom: 1px solid #1a2030; background: #080c12;
  display: flex; align-items: center; gap: 0; overflow-x: auto;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-bar .tab-context {
  font-size: 12px; color: #67E8F9; font-weight: 600; padding: 10px 0;
  margin-right: 20px; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.tab-bar .tab-context svg { width: 16px; height: 16px; }
.tab {
  padding: 10px 16px; font-size: 11px; color: #4a5568; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap;
}
.tab:hover { color: #8892a0; }
.tab.active { color: #bfc7d5; border-bottom-color: #0891B2; }
.tab .tab-badge {
  font-size: 8px; padding: 1px 4px; border-radius: 2px;
  margin-left: 4px; vertical-align: middle;
}
.tab-badge-green { background: #0a1f0a; color: #22c55e; }
.tab-badge-amber { background: #1a1a00; color: #f59e0b; }
.tab-badge-dim { background: #141a24; color: #6b7d8e; }

/* Messages */
.chat-messages { flex: 1; padding: 20px; overflow-y: auto; line-height: 1.7; }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }
.msg { margin-bottom: 14px; }
.msg-role { font-size: 9px; color: #0891B2; margin-bottom: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.msg-role.user { color: #67E8F9; }
.msg-role.system { color: #22c55e; }
.msg-text { font-size: 13px; color: #8892a0; }
.msg-text strong { color: #bfc7d5; font-weight: 600; }
.msg-text em { color: #6b7d8e; font-style: italic; }
.msg-text code { background: #0d1117; padding: 1px 5px; border-radius: 3px; color: #06B6D4; font-size: 12px; }

/* Input */
.chat-input-area { padding: 12px 20px; border-top: 1px solid #1a2030; background: #080c12; }
.chat-input-row { display: flex; align-items: center; gap: 10px; }
.mode-indicator {
  font-size: 9px; padding: 3px 7px; border-radius: 3px;
  background: #0d2a35; color: #0891B2; border: 1px solid #0891B2;
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
}
.chat-input {
  flex: 1; background: #0d1117; border: 1px solid #1a2030; border-radius: 4px;
  padding: 8px 12px; color: #bfc7d5; font-family: inherit; font-size: 13px;
  outline: none; transition: border-color 0.15s;
}
.chat-input:focus { border-color: #0891B2; }
.chat-input::placeholder { color: #2a3540; }
.send-btn {
  padding: 8px 16px; background: #0891B2; color: #06080c; border: none;
  border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 10px;
  font-weight: 700; letter-spacing: 1px; transition: background 0.15s;
}
.send-btn:hover { background: #06B6D4; }
.command-hints { display: flex; gap: 6px; margin-top: 6px; font-size: 9px; color: #2a3540; }
.command-hints span { cursor: pointer; transition: color 0.15s; }
.command-hints span:hover { color: #0891B2; }

/* ========== Self Floating Window ========== */
.self-float {
  position: fixed; width: 300px; height: 340px;
  background: #0a0e14; border: 1px solid #1a2030; border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: flex; flex-direction: column;
  z-index: 100; overflow: hidden; resize: both; min-width: 260px; min-height: 280px;
}
.self-float.hidden { display: none; }

.self-header {
  padding: 10px 14px; border-bottom: 1px solid #1a2030;
  display: flex; align-items: center; gap: 8px; background: #080c12; cursor: grab;
}
.self-header:active { cursor: grabbing; }
.self-avatar-wrap { position: relative; }
.self-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; line-height: 1; box-shadow: 0 0 8px rgba(245,158,11,0.3);
}
.self-avatar-status {
  position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
  border: 2px solid #080c12;
}
.self-name { font-size: 11px; color: #f59e0b; font-weight: 500; }
.self-sub { font-size: 9px; color: #3a4550; }
.self-close { margin-left: auto; color: #3a4550; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 3px; }
.self-close:hover { color: #bfc7d5; background: #141a24; }

.self-messages {
  flex: 1; padding: 10px 14px; overflow-y: auto; font-size: 11px; line-height: 1.7;
}
.self-messages::-webkit-scrollbar { width: 3px; }
.self-messages::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 2px; }
.self-msg { margin-bottom: 8px; }
.self-msg-role { font-size: 8px; color: #3a4550; margin-bottom: 1px; text-transform: uppercase; letter-spacing: 1px; }
.self-msg-text { color: #8892a0; }
.self-msg-text strong { color: #bfc7d5; }

.self-input-row {
  display: flex; align-items: center; padding: 8px 14px;
  border-top: 1px solid #1a2030; gap: 6px;
}
.self-input-row input {
  flex: 1; background: #0d1117; border: 1px solid #1a2030; border-radius: 3px;
  padding: 5px 8px; color: #bfc7d5; font-family: inherit; font-size: 11px; outline: none;
}
.self-input-row input:focus { border-color: #f59e0b; }
.self-input-row input::placeholder { color: #2a3540; }

/* Self trigger - cute avatar button */
.self-trigger {
  position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px;
  border-radius: 50%; border: 2px solid #f59e0b40; cursor: pointer; z-index: 99;
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; line-height: 1; box-shadow: 0 4px 16px rgba(245,158,11,0.25);
  transition: all 0.2s; animation: float 3s ease-in-out infinite;
}
.self-trigger:hover { transform: scale(1.1); box-shadow: 0 4px 24px rgba(245,158,11,0.4); border-color: #f59e0b; }
.self-trigger.hidden { display: none; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

/* Context flash */
.context-flash {
  position: absolute; inset: 0; background: #0891B2;
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
}
.context-flash.active { opacity: 0.05; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <svg viewBox="0 0 80 80" fill="none"><path d="M 2 14 C 16 8, 32 22, 44 38 C 52 50, 62 52, 72 48 C 76 46, 78 44, 78 44" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/><path d="M 2 66 C 14 58, 28 46, 42 40 C 52 36, 62 40, 70 44 C 75 46, 78 44, 78 44" stroke="#0891B2" stroke-width="5" stroke-linecap="round" fill="none" opacity="1"/><path d="M 2 40 C 14 28, 30 26, 42 34 C 54 42, 60 46, 70 43 C 75 43, 78 44, 78 44" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/></svg>
    <span class="brand">RING</span>
    <span class="version">v0.1</span>

  <div class="sidebar-scroll">

        <div class="ring-item" onclick="switchContext('ring','archive')"><span>📦</span> 归档</div>
        <div class="session-active" onclick="switchContext('session','chat')"><span class="pulse"></span> Q2 竞品评审</div>
      </div>
    </div>

    <div class="ring-group">
      <div class="ring-header" onclick="toggleRing(this)">
        <span class="chevron">▸</span>
        <span class="dot" style="background:#22c55e"></span>
        <span class="ring-name">技术架构组</span>
        <span class="ring-badge">8n</span>
      </div>
      <div class="ring-items">
        <div class="ring-item"><span>💬</span> 对话</div>
        <div class="ring-item"><span>🗺</span> 图谱</div>
        <div class="ring-item"><span>📦</span> 归档</div>
      </div>
    </div>

    <div class="ring-group">
      <div class="ring-header" onclick="toggleRing(this)">
        <span class="chevron">▸</span>
        <span class="dot" style="background:#f59e0b"></span>
        <span class="ring-name">产品设计组</span>
        <span class="ring-badge">5n</span>
      </div>
      <div class="ring-items">
        <div class="ring-item"><span>💬</span> 对话</div>
        <div class="ring-item"><span>🗺</span> 图谱</div>
        <div class="ring-item"><span>📦</span> 归档</div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="avatar">K</div>
    <span class="user-name">kaiiang</span>
    <span class="settings-btn">⚙</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="context-flash" id="flash"></div>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar"></div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="chat-input-row">
      <span class="mode-indicator" id="modeIndicator">super</span>
      <input class="chat-input" id="chatInput" placeholder="message / command..." />
      <button class="send-btn">SEND</button>
    </div>
    <div class="command-hints" id="cmdHints"></div>
  </div>
</div>

<!-- Self Float -->
<div class="self-float hidden" id="selfFloat" style="bottom:80px;right:24px">
  <div class="self-header" id="selfHeader">
    <div class="self-avatar-wrap">
      <div class="self-avatar">🐱</div>
      <div class="self-avatar-status"></div>
    </div>
    <div>
      <div class="self-name">Self · AI 宠物</div>
      <div class="self-sub">private · not shared</div>

    <div class="self-msg"><div class="self-msg-role">self</div>
    <div class="self-msg-text">我发现你对「竞品分析」内容的归档偏好是按主题分节点，粒度适中。</div></div>
    <div class="self-msg"><div class="self-msg-role">suggestion</div>
    <div class="self-msg-text" style="color:#f59e0b">💡 可以试试 <code>/auto</code> 模式，以你目前的频率 Auto 可能更适合你</div></div>
  </div>
  <div class="self-input-row"><input placeholder="和 Self 聊聊..." /></div>
</div>
<div class="self-trigger" id="selfTrigger" onclick="toggleSelf()">🐱</div>

<script>
// ---- Tab bar configs ----
const tabConfigs = {
  super: {
    context: 'Super Ring',
    tabs: [
      { id: 'chat', label: '💬 Chat' },
      { id: 'rings', label: 'Rings', badge: ['3', 'dim'] },
      { id: 'skills', label: 'Skills' },

    ],
    mode: 'super',

      settings: `<div class="msg"><div class="msg-role" style="color:#67E8F9">super ring</div><div class="msg-text"><strong style="color:#bfc7d5">Global Settings</strong><br><br>LLM: <code>openai/gpt-4o</code><br>GitLab: <code>gitlab.company.com</code> · connected ✓<br>Privacy: <code>default</code><br><br><em>Change with <code>/settings llm</code>, <code>/settings gitlab</code></em></div></div>`,

  session: {

let currentCtx = 'super';
let currentTab = 'chat';

function switchContext(ctx, tab) {
  currentCtx = ctx;
  currentTab = tab || 'chat';
  const config = tabConfigs[ctx];

  // Flash
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 150);

  // Mode
  document.getElementById('modeIndicator').textContent = config.mode;
  document.getElementById('cmdHints').innerHTML = config.hints.map(h => `<span>${h}</span>`).join('');

  renderTabs();
  renderMessages();

  // Sidebar active
  document.querySelectorAll('.nav-super,.ring-item,.session-active').forEach(el => el.classList.remove('active'));
  if (ctx === 'super') document.querySelector('.nav-super').classList.add('active');
  if (ctx === 'ring') document.querySelector('.ring-group.active .ring-item:nth-child(1)').classList.add('active');
  if (ctx === 'session') document.querySelector('.ring-group.active .session-active').classList.add('active');
}

function switchTab(tab) {
  currentTab = tab;
  renderTabs();
  renderMessages();
}

function renderTabs() {
  const config = tabConfigs[currentCtx];
  let html = `<div class="tab-context">${config.context}</div>`;
  config.tabs.forEach(t => {
    const cls = t.id === currentTab ? 'active' : '';
    let badge = '';
    if (t.badge) badge = `<span class="tab-badge tab-badge-${t.badge[1]}">${t.badge[0]}</span>`;
    html += `<div class="tab ${cls}" onclick="switchTab('${t.id}')">${t.label}${badge}</div>`;
  });
  document.getElementById('tabBar').innerHTML = html;
}

function renderMessages() {
  const config = tabConfigs[currentCtx];
  document.getElementById('chatMessages').innerHTML = config.messages[currentTab] || config.messages.chat;
}

function toggleRing(el) {
  const group = el.parentElement;
  group.querySelector('.ring-items').classList.toggle('open');
  el.querySelector('.chevron').classList.toggle('open');
}

// Self toggle
function toggleSelf() {
  document.getElementById('selfFloat').classList.toggle('hidden');
  document.getElementById('selfTrigger').classList.toggle('hidden');
}

// Drag Self window
(function() {
  const header = document.getElementById('selfHeader');
  const win = document.getElementById('selfFloat');
  let dragging = false, startX, startY, startLeft, startTop;

  header.addEventListener('mousedown', e => {
    dragging = true;
    const rect = win.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = rect.left; startTop = rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    win.style.left = (startLeft + dx) + 'px';
    win.style.top = (startTop + dy) + 'px';
    win.style.right = 'auto';
    win.style.bottom = 'auto';
  });

  document.addEventListener('mouseup', () => { dragging = false; });
})();

// Init
switchContext('super', 'chat');

// @self auto-open
document.getElementById('chatInput').addEventListener('input', function(e) {
  if (e.target.value.startsWith('@self') && document.getElementById('selfFloat').classList.contains('hidden')) toggleSelf();
});
</script>
