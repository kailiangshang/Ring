<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring 功能开发图谱</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    #graph { width: 100vw; height: 100vh; }
    .node { cursor: pointer; }
    .node circle { stroke: #fff; stroke-width: 2px; transition: all 0.3s; }
    .node:hover circle { stroke-width: 4px; }
    .node text { font-size: 12px; fill: #eee; pointer-events: none; }
    .link { stroke: #555; stroke-opacity: 0.6; stroke-width: 1.5px; }
    .link.requires { stroke: #e74c3c; }
    .link.provides { stroke: #2ecc71; stroke-dasharray: 5,5; }
    .panel { position: fixed; top: 20px; right: 20px; background: rgba(30,30,50,0.95); border: 1px solid #444; border-radius: 12px; padding: 20px; width: 320px; max-height: 80vh; overflow-y: auto; z-index: 100; }
    .panel h2 { font-size: 16px; margin-bottom: 12px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-pending { background: #555; color: #ccc; }
    .status-dev { background: #3498db; color: #fff; }
    .status-done { background: #2ecc71; color: #fff; }
    .status-blocked { background: #e74c3c; color: #fff; }
    .dep-list { margin: 8px 0; padding-left: 16px; font-size: 12px; color: #aaa; }
    .dep-list li { margin: 4px 0; }
    .legend { position: fixed; bottom: 20px; left: 20px; background: rgba(30,30,50,0.95); border: 1px solid #444; border-radius: 8px; padding: 12px; font-size: 12px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .legend-line { width: 24px; height: 2px; }
    .legend-circle { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; }
    .controls { position: fixed; top: 20px; left: 20px; z-index: 100; }
    .controls button { background: #3498db; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 8px; }
    .controls button:hover { background: #2980b9; }
    .controls input { background: #2a2a4a; border: 1px solid #444; color: #eee; padding: 8px 12px; border-radius: 6px; width: 200px; }
    .node-detail { font-size: 13px; line-height: 1.6; }
    .node-detail .section { margin-top: 12px; }
    .node-detail .section-title { color: #888; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="controls">
    <input type="text" id="search" placeholder="搜索功能..." oninput="filterNodes(this.value)">
    <button onclick="resetZoom()">重置视图</button>
    <button onclick="toggleLabels()">切换标签</button>
  </div>
  <div id="graph"></div>
  <div class="panel" id="detail-panel" style="display:none;">
    <h2 id="node-title">功能详情</h2>
    <div id="node-content"></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-circle" style="fill:#9b59b6;border-color:#9b59b6"></div><span>功能点</span></div>
    <div class="legend-item"><div class="legend-circle" style="fill:#1abc9c;border-color:#1abc9c"></div><span>原子能力</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#e74c3c"></div><span>依赖关系</span></div>
    <div class="legend-item"><div class="legend-line" style="background:#2ecc71"></div><span>提供能力</span></div>
  </div>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;
    let showLabels = true;

    const statusLabels = {
      pending: '待开发',
      dev: '开发中',
      done: '已完成',
      blocked: '被阻塞'
    };

    const statusClass = {
      pending: 'status-pending',
      dev: 'status-dev',
      done: 'status-done',
      blocked: 'status-blocked'
    };

    const nodes = [
      // 四层 AI 架构（功能点）
      { id: 'super-ring', name: 'Super Ring', type: 'feature', status: 'pending',
        desc: '全局助手，跨 Ring 分析，Ring 管理引导',
        deps: ['llm-sse', 'graph-crud', 'cross-ring-query'] },
      { id: 'group-ring', name: 'Group Ring', type: 'feature', status: 'done',
        desc: '群组专属 AI，读写本 Ring 图谱和归档',
        deps: ['llm-sse', 'graph-crud', 'mode-switch'] },
      { id: 'session-ring', name: 'Session Ring', type: 'feature', status: 'dev',
        desc: '多人实时讨论，加载 Skill 决定行为',
        deps: ['llm-sse', 'websocket', 'session-lifecycle', 'skill-loader'] },
      { id: 'self', name: 'Self', type: 'feature', status: 'pending',
        desc: '用户私有 AI 宠物，完全私有，不进 Git',
        deps: ['llm-sse', 'self-storage'] },

      // 核心功能
      { id: 'gitlab-integration', name: 'GitLab 集成', type: 'feature', status: 'pending',
        desc: 'Repo 创建、git 操作、PR 工作流、.group 文件同步',
        deps: ['gitlab-api', 'file-sync'] },
      { id: 'graph-viz', name: 'Graph 可视化', type: 'feature', status: 'pending',
        desc: 'D3.js 图谱可视化，节点树状图 + 缩放平移',
        deps: ['graph-crud', 'd3-viz'] },
      { id: 'archive-pr', name: 'Archive/PR 工作流', type: 'feature', status: 'pending',
        desc: 'PR 队列、代码审查、归档管理',
        deps: ['gitlab-api', 'graph-viz'] },
      { id: 'skill-system', name: 'Skill 系统', type: 'feature', status: 'pending',
        desc: 'Claude Code Skill 格式，YAML frontmatter + Markdown',
        deps: ['skill-loader', 'skill-storage'] },
      { id: 'notification', name: '通知系统', type: 'feature', status: 'pending',
        desc: 'WebSocket 事件驱动的通知 UI',
        deps: ['websocket'] },
      { id: 'export', name: '导出系统', type: 'feature', status: 'pending',
        desc: '导出 Ring 内容为 Markdown/JSON/PDF',
        deps: ['file-storage'] },

      // 原子化能力
      { id: 'llm-sse', name: 'LLM SSE 流式对话', type: 'atomic', status: 'done',
        desc: 'async-openai + SSE 流式输出，支持 OpenAI + Ollama',
        provides: ['llm-chat'] },
      { id: 'websocket', name: 'WebSocket 实时通讯', type: 'atomic', status: 'done',
        desc: 'ws_hub.rs 连接管理，Session 频道，广播机制',
        provides: ['realtime', 'session-sync'] },
      { id: 'graph-crud', name: 'Graph CRUD', type: 'atomic', status: 'done',
        desc: '图谱节点/边的增删改查，SQLite 存储',
        provides: ['graph-data'] },
      { id: 'mode-switch', name: 'Mode 切换', type: 'atomic', status: 'done',
        desc: 'normal/auto 模式，skill_permission 控制',
        provides: ['permission-control'] },
      { id: 'session-lifecycle', name: 'Session 生命周期', type: 'atomic', status: 'dev',
        desc: 'material_prep → discussion → summary → closed',
        provides: ['session-mgmt'],
        blockedBy: ['skill-system'] },
      { id: 'command-parser', name: '命令解析系统', type: 'atomic', status: 'done',
        desc: '@, #, !, % 命令解析',
        provides: ['cmd-parsing'] },
      { id: 'setup-wizard', name: 'Setup 向导', type: 'atomic', status: 'done',
        desc: '身份配置 → LLM 配置 → GitLab 配置 → 完成',
        provides: ['user-init'] },
      { id: 'ring-crud', name: 'Ring CRUD', type: 'atomic', status: 'done',
        desc: 'Ring 创建、列表、详情',
        provides: ['ring-mgmt'] },
      { id: 'member-crud', name: 'Member 管理', type: 'atomic', status: 'done',
        desc: '成员增删改，角色管理',
        provides: ['member-mgmt'] },
      { id: 'd3-viz', name: 'D3.js 可视化', type: 'atomic', status: 'pending',
        desc: '力导向图、缩放、平移、拖拽',
        provides: ['graph-render'] },
      { id: 'gitlab-api', name: 'GitLab API 客户端', type: 'atomic', status: 'pending',
        desc: 'repo、branch、commit、PR、MR 操作',
        provides: ['git-ops'] },
      { id: 'file-sync', name: '文件同步', type: 'atomic', status: 'pending',
        desc: '.group/ 文件与 GitLab 同步',
        provides: ['doc-sync'],
        deps: ['gitlab-api'] },
      { id: 'file-storage', name: '文件存储', type: 'atomic', status: 'pending',
        desc: '本地文件读写，markdown 渲染',
        provides: ['file-ops'] },
      { id: 'skill-loader', name: 'Skill 加载器', type: 'atomic', status: 'pending',
        desc: 'YAML frontmatter 解析，Markdown 执行',
        provides: ['skill-exec'],
        deps: ['file-storage'] },
      { id: 'skill-storage', name: 'Skill 存储', type: 'atomic', status: 'pending',
        desc: 'Skill 列表、启用/禁用、用户自定义',
        provides: ['skill-persist'],
        deps: ['file-storage'] },
      { id: 'self-storage', name: 'Self 持久化', type: 'atomic', status: 'pending',
        desc: 'Self 消息存储，记忆管理',
        provides: ['self-memory'],
        deps: ['file-storage'] },
      { id: 'cross-ring-query', name: '跨 Ring 查询', type: 'atomic', status: 'pending',
        desc: 'Super Ring 跨 Ring 分析查询',
        provides: ['super-query'],
        deps: ['graph-crud', 'ring-crud'] },
      { id: 'auth-system', name: 'Auth 权限系统', type: 'atomic', status: 'pending',
        desc: 'X-Ring-Token 认证，成员角色权限',
        provides: ['access-control'] },
    ];

    const links = [];

    nodes.forEach(n => {
      if (n.deps) {
        n.deps.forEach(depId => {
          links.push({ source: n.id, target: depId, type: 'requires' });
        });
      }
      if (n.provides) {
        n.provides.forEach(provId => {
          const targetId = provId + '-need';
          if (!nodes.find(x => x.id === targetId)) {
            nodes.push({ id: targetId, name: provId, type: 'capability', status: 'done' });
          }
          links.push({ source: n.id, target: targetId, type: 'provides' });
        });
      }
      if (n.blockedBy) {
        n.blockedBy.forEach(blockerId => {
          links.push({ source: n.id, target: blockerId, type: 'blocked' });
        });
      }
    });

    const svg = d3.select('#graph')
      .append('svg')
      .attr('width', width)
      .attr('height', height);

    const g = svg.append('g');

    svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', (e) => {
      g.attr('transform', e.transform);
    }));

    const color = (type, status) => {
      if (type === 'feature') {
        return status === 'done' ? '#9b59b6' : status === 'dev' ? '#8e44ad' : '#8e44ad';
      }
      if (type === 'atomic') {
        return '#1abc9c';
      }
      if (type === 'capability') {
        return '#3498db';
      }
      return '#666';
    };

    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(100))
      .force('charge', d3.forceManyBody().strength(-400))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(50));

    const link = g.selectAll('.link')
      .data(links)
      .enter()
      .append('line')
      .attr('class', d => 'link ' + d.type)
      .style('stroke', d => d.type === 'requires' ? '#e74c3c' : d.type === 'blocked' ? '#f39c12' : '#2ecc71')
      .style('stroke-dasharray', d => d.type === 'provides' ? '5,5' : 'none');

    const node = g.selectAll('.node')
      .data(nodes)
      .enter()
      .append('g')
      .attr('class', 'node')
      .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
      .on('click', (e, d) => showDetail(d));

    node.append('circle')
      .attr('r', d => d.type === 'feature' ? 20 : d.type === 'atomic' ? 14 : 10)
      .attr('fill', d => color(d.type, d.status));

    node.append('text')
      .attr('dx', d => d.type === 'feature' ? 28 : 20)
      .attr('dy', 4)
      .text(d => d.name)
      .style('display', showLabels ? 'block' : 'none');

    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(e, d) {
      if (!e.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragended(e, d) {
      if (!e.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }

    function showDetail(d) {
      const panel = document.getElementById('detail-panel');
      const title = document.getElementById('node-title');
      const content = document.getElementById('node-content');
      title.textContent = d.name;
      let html = `<div class="node-detail">
        <span class="status ${statusClass[d.status]}">${statusLabels[d.status]}</span>
        <p style="margin-top:12px;color:#aaa">${d.desc || ''}</p>`;
      if (d.type === 'feature' && d.deps) {
        html += `<div class="section"><div class="section-title">依赖能力</div><ul class="dep-list">`;
        d.deps.forEach(dep => {
          const depNode = nodes.find(n => n.id === dep);
          html += `<li>${depNode ? depNode.name : dep} <span class="status ${statusClass[depNode?.status || 'pending']}">${statusLabels[depNode?.status || 'pending']}</span></li>`;
        });
        html += `</ul></div>`;
      }
      if (d.provides) {
        html += `<div class="section"><div class="section-title">提供能力</div><ul class="dep-list">`;
        d.provides.forEach(p => html += `<li>${p}</li>`);
        html += `</ul></div>`;
      }
      html += `</div>`;
      content.innerHTML = html;
      panel.style.display = 'block';
    }

    function filterNodes(q) {
      const low = q.toLowerCase();
      node.style('opacity', d => !q || d.name.toLowerCase().includes(low) ? 1 : 0.1);
      link.style('opacity', d => !q || (d.source.name.toLowerCase().includes(low) || d.target.name.toLowerCase().includes(low)) ? 1 : 0.1);
    }

    function resetZoom() {
      svg.transition().duration(500).call(d3.zoom().transform, d3.zoomIdentity);
    }

    function toggleLabels() {
      showLabels = !showLabels;
      node.select('text').style('display', showLabels ? 'block' : 'none');
    }

    window.addEventListener('resize', () => {
      svg.attr('width', window.innerWidth).attr('height', window.innerHeight);
      simulation.force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
      simulation.alpha(0.3).restart();
    });
  </script>
</body>
</html>
