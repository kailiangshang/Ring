<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Ring</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:520px;width:100%;padding:24px}
.card{background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h1{font-size:24px;font-weight:600;margin-bottom:4px}
.description{color:#86868b;font-size:15px;margin-bottom:16px}
.member-count{color:#86868b;font-size:13px;margin-bottom:28px}
.section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#86868b;margin-bottom:12px}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:28px}
.download-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;color:#1d1d1f;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.15s}
.download-btn:hover{border-color:#0071e3;color:#0071e3}
.download-btn.recommended{border-color:#0071e3;background:#0071e3;color:#fff}
.download-btn.recommended:hover{background:#0077ed}
.download-btn .os-icon{font-size:16px}
.continue-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:#1d1d1f;color:#fff;font-size:15px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;transition:background 0.15s}
.continue-btn:hover{background:#424245}
.error{text-align:center;padding:60px 32px}
.error h1{font-size:20px;color:#ff3b30;margin-bottom:8px}
.error p{color:#86868b;font-size:15px}
</style>
</head>
<body>
<div class="container">
<div class="card" id="main-content">
<h1 id="ring-name"></h1>
<p class="description" id="ring-description"></p>
<p class="member-count" id="member-count"></p>

<p class="section-title">Download Ring</p>
<div class="downloads" id="downloads">
<a class="download-btn" id="dl-windows" href="">
<span class="os-icon">&#x229E;</span> Windows
</a>
<a class="download-btn" id="dl-linux" href="">
<span class="os-icon">&#x2318;</span> Linux
</a>
<a class="download-btn" id="dl-macos-arm" href="">
<span class="os-icon">&#xF8FF;</span> macOS (Apple Silicon)
</a>
<a class="download-btn" id="dl-macos-intel" href="">
<span class="os-icon">&#xF8FF;</span> macOS (Intel)
</a>
</div>

<a class="continue-btn" id="continue-btn" href="">Continue to Join</a>
</div>
</div>
<script>
(function(){
var data=window.__RING_JOIN_DATA__;
if(!data){return}

document.getElementById('ring-name').textContent=data.ring_name;
document.getElementById('ring-description').textContent=data.ring_description||'';
document.getElementById('member-count').textContent=data.member_count+' member'+(data.member_count!==1?'s':'');

var dl=data.downloads;
document.getElementById('dl-windows').href=dl.windows;
document.getElementById('dl-linux').href=dl.linux;
document.getElementById('dl-macos-arm').href=dl.macos_arm;
document.getElementById('dl-macos-intel').href=dl.macos_intel;

var platform=navigator.platform||'';
var ua=navigator.userAgent||'';
var recommended=null;
if(platform.indexOf('Win')>=0){recommended='dl-windows'}
else if(ua.indexOf('Mac OS')>=0){
if(ua.indexOf('ARM')>=0||platform==='MacIntel'&&typeof navigator.hardwareConcurrency!=='undefined'){recommended='dl-macos-arm'}
else{recommended='dl-macos-arm'}
}else if(platform.indexOf('Linux')>=0){recommended='dl-linux'}
if(recommended){
var el=document.getElementById(recommended);
if(el){el.classList.add('recommended')}
}

var joinUrl='http://localhost:7420/join?token='+encodeURIComponent(data.token);
if(data.creator_ip){joinUrl+='&creator_ip='+encodeURIComponent(data.creator_ip)}
document.getElementById('continue-btn').href=joinUrl;
})();
</script>
</body>
</html>
